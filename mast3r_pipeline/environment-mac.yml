name: mast3r
channels:
  - pytorch
  - conda-forge
  - defaults

dependencies:
  - python=3.11
  - cmake
  - pytorch
  - torchvision
  - jpeg
  - libjpeg-turbo
  - pip
  - pip:
      - open3d=0.19.0
      - trimesh
      - Pillow
      - numpy
      - opencv-python
      - matplotlib
      - tqdm
      - scipy
      - scikit-learn
      - roma
      - einops
      - huggingface-hub[torch]
